name: ci

on: [push, pull_request]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Rebuild report and check it is up to date
        run: |
          python scripts/build_report.py > /dev/null
          git diff --exit-code -- reports/summary.md reports/tables
